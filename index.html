<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SISTEMA DE ANÁLISE DE IMPACTO</title>
    <style>
        :root {
            --lizard-green: #22c55e;
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090514;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Interface Principal */
        .painel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .game-card {
            pointer-events: auto;
            width: 85%;
            max-width: 400px;
            padding: 30px 20px;
            background: rgba(15, 10, 25, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 2px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
            text-align: center;
            box-sizing: border-box;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px var(--lizard-green);
            line-height: 1.2;
        }

        h2 {
            font-size: 1.4rem;
            color: #e2e8f0;
            font-family: sans-serif;
            margin: 0 0 15px 0;
        }

        .contador {
            font-size: 1rem;
            color: #cbd5e1;
            font-family: sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        /* Objeto Arremessável (Lagartixa) */
        #lagartixa-token {
            position: absolute;
            width: 75px;
            height: 75px;
            font-size: 3.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            z-index: 4;
            user-select: none;
            touch-action: none;
            filter: drop-shadow(0 0 10px var(--lizard-green));
        }

        #lagartixa-token:active {
            cursor: grabbing;
            filter: drop-shadow(0 0 20px var(--neon-blue));
        }

        /* Vitória */
        .vitoria {
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.4) !important;
        }
        .vitoria h1 {
            color: #ffffff !important;
            text-shadow: 0 0 20px var(--neon-pink), 0 0 40px #9d4edd !important;
            font-size: 2.5rem !important;
            animation: balancar 0.3s infinite alternate;
        }
        .vitoria h2 {
            color: #00f0ff !important;
            font-size: 2rem !important;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6) !important;
            margin-top: 15px;
        }

        @keyframes balancar {
            0% { transform: rotate(-2deg) scale(0.98); }
            100% { transform: rotate(2deg) scale(1.02); }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- Token da Lagartixa que ela vai arrastar e tacar na parede -->
    <div id="lagartixa-token">🦎</div>

    <div class="painel-container">
        <div class="game-card" id="painel">
            <h1 id="titulo">Me joga na<br>parede...</h1>
            <h2 id="subtitulo">Arremesse a lagartixa nas bordas!</h2>
            <div class="contador" id="placar">Pancadas na parede: 0/3</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const token = document.getElementById('lagartixa-token');
        const painel = document.getElementById('painel');
        const placar = document.getElementById('placar');
        const subtitulo = document.getElementById('subtitulo');

        let particulas = [];
        let impactos = 0;
        let finalizado = false;
        let flashColor = null;

        // Propriedades físicas da Lagartixa
        let physics = {
            x: window.innerWidth / 2 - 37,
            y: window.innerHeight * 0.7,
            vx: 0,
            vy: 0,
            isDragging: false,
            lastX: 0,
            lastY: 0,
            width: 75,
            height: 75,
            bounce: 0.75,
            gravity: 0.4
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(!physics.isDragging && !finalizado) {
                physics.x = canvas.width / 2 - physics.width / 2;
                physics.y = canvas.height * 0.75;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Posiciona a lagartixa inicialmente
        token.style.left = physics.x + 'px';
        token.style.top = physics.y + 'px';

        class Brilho {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 2;
                this.vx = (Math.random() - 0.5) * 14;
                this.vy = (Math.random() - 0.5) * 14;
                this.color = color || '#22c55e';
                this.life = 40;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Leve gravidade nas faíscas
                this.life--;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 40;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function som(f, d, tipo="sine") {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = tipo;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
                osc.start(); osc.stop(audioCtx.currentTime + d);
            } catch(e) {}
        }

        // Lógica de arrastar e soltar (Touch & Mouse)
        function startDrag(e) {
            if (finalizado) return;
            physics.isDragging = true;
            let pageX = e.touches ? e.touches[0].pageX : e.pageX;
            let pageY = e.touches ? e.touches[0].pageY : e.pageY;
            physics.lastX = pageX;
            physics.lastY = pageY;
            physics.vx = 0;
            physics.vy = 0;
        }

        function doDrag(e) {
            if (!physics.isDragging || finalizado) return;
            let pageX = e.touches ? e.touches[0].pageX : e.pageX;
            let pageY = e.touches ? e.touches[0].pageY : e.pageY;

            physics.x = pageX - physics.width / 2;
            physics.y = pageY - physics.height / 2;

            // Calcula velocidade com base no movimento do dedo
            physics.vx = pageX - physics.lastX;
            physics.vy = pageY - physics.lastY;

            physics.lastX = pageX;
            physics.lastY = pageY;

            token.style.left = physics.x + 'px';
            token.style.top = physics.y + 'px';
        }

        function endDrag() {
            if(!physics.isDragging) return;
            physics.isDragging = false;
        }

        token.addEventListener('touchstart', startDrag, {passive: true});
        window.addEventListener('touchmove', doDrag, {passive: false});
        window.addEventListener('touchend', endDrag);

        token.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', endDrag);

        function computarImpacto(x, y) {
            impactos++;
            flashColor = 'rgba(0, 240, 255, 0.25)';
            setTimeout(() => { flashColor = null; }, 100);
            
            som(180, 0.15, 'triangle'); // Som de baque surdo
            
            for(let i=0; i<20; i++) {
                particulas.push(new Brilho(x, y, '#00f0ff'));
            }

            if (impactos < 3) {
                placar.innerText = `Pancadas na parede: ${impactos}/3`;
            } else {
                vitoriaGeral();
            }
        }

        function vitoriaGeral() {
            finalizado = true;
            physics.vx = 0; physics.vy = 0;
            token.remove();
            placar.style.display = 'none';
            subtitulo.style.display = 'none';
            painel.classList.add('vitoria');
            
            painel.querySelector('h1').innerHTML = "ME JOGA NA PAREDE...";
            
            setTimeout(() => {
                let h2 = document.createElement('h2');
