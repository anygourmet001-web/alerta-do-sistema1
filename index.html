<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALERTA DO SISTEMA</title>
    <style>
        body {
            background: linear-gradient(135deg, #450a0a, #7f1d1d, #78350f); /* Fundo de aviso e suspense */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Chuva de elementos de espionagem/alerta */
        .alerta-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-alerta {
            position: absolute;
            top: -60px;
            font-size: 2.5rem;
            animation: cair 3.5s linear infinite;
            user-select: none;
        }

        /* Variações de tempo e posições da chuva */
        .a1 { left: 10%; animation-duration: 3s; animation-delay: 0s; }
        .a2 { left: 35%; animation-duration: 4.5s; animation-delay: 1.2s; font-size: 3rem; }
        .a3 { left: 55%; animation-duration: 3.8s; animation-delay: 0.5s; }
        .a4 { left: 78%; animation-duration: 4.2s; animation-delay: 1.8s; font-size: 3.5rem; }
        .a5 { left: 90%; animation-duration: 3.2s; animation-delay: 0.8s; }

        /* Bloco de texto central em destaque */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: tremer 0.15s linear infinite;
        }

        h1 {
            font-size: 4.5rem;
            color: #fef08a; /* Amarelo brilhante de aviso */
            text-shadow: 0 0 20px #ef4444, 0 0 40px #b91c1c;
            margin: 0;
            letter-spacing: 3px;
        }

        h2 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        }

        /* Animações */
        @keyframes cair {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Efeito de tela tremendo levemente de urgência */
        @keyframes tremer {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            100% { transform: translate(-1px, -1px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- Emojis caindo no fundo -->
    <div class="alerta-bg">
        <div class="elemento-alerta a1">🚨</div>
        <div class="elemento-alerta a2">👀</div>
        <div class="elemento-alerta a3">🕵️‍♂️</div>
        <div class="elemento-alerta a4">🚨</div>
        <div class="elemento-alerta a5">👀</div>
    </div>

    <div class="conteudo">
        <h1>SOGRA!!</h1>
        <h2>Olha o perigo vindo aí! 👵🏃‍♂️💨</h2>
    </div>

</body>
</html>
