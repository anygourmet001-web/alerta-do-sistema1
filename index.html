<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 ALERTA DE REALEZA 👑</title>
    <style>
        :root {
            --hot-pink: #ff007f;
            --gold-shine: #ffd700;
            --deep-passion: #1a000d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #10000a; /* Fundo escuro luxuoso */
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sistema de Partículas Avançado (Brilhos e Joias) */
        #glamour-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .luxury-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.18), transparent 65%);
            z-index: 2;
            pointer-events: none;
        }

        /* Card Glamour Glassmorphism */
        .glamour-card {
            position: relative;
            z-index: 3;
            width: 85%;
            max-width: 400px;
            padding: 45px 25px;
            background: rgba(20, 0, 12, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 2px solid rgba(255, 0, 127, 0.5);
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.35), inset 0 0 25px rgba(255, 215, 0, 0.15);
            text-align: center;
            animation: flutuarCard 4s ease-in-out infinite alternate;
        }

        /* Coroa de Ouro Ilustrada em CSS */
        .coroa-visual {
            width: 80px;
            height: 40px;
            background: var(--gold-shine);
            margin: 0 auto 25px auto;
            position: relative;
            clip-path: polygon(0% 100%, 100% 100%, 100% 20%, 80% 60%, 50% 0%, 20% 60%, 0% 20%);
            animation: pulsarCoroa 1.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px #ffb700);
        }

        /* Tipografia de Alto Impacto */
        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 25px var(--hot-pink);
            line-height: 1.2;
        }

        h2 {
            font-size: 1.3rem;
            color: var(--gold-shine);
            margin: 20px 0 30px 0;
            font-family: sans-serif;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        /* Botão Premium Magnético */
        .glamour-button {
            background: linear-gradient(45deg, var(--hot-pink), #9d4edd);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--hot-pink);
            transition: all 0.3s ease;
            width: 100%;
            letter-spacing: 1px;
        }

        .glamour-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 40px var(--gold-shine);
        }

        /* Animações Avançadas */
        @keyframes flutuarCard {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.02); border-color: var(--gold-shine); box-shadow: 0 0 60px rgba(255, 215, 0, 0.25); }
        }

        @keyframes pulsarCoroa {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-5px) scale(1.08); }
        }
    </style>
</head>
<body>

    <!-- Canvas de Brilhos e Glamour -->
    <canvas id="glamour-canvas"></canvas>
    <div class="luxury-glow"></div>

    <!-- Interface Premium -->
    <div class="glamour-card">
        <div class="coroa-visual"></div>
        <h1>Gostooooosaaaaaaaa</h1>
        <h2>✨ Uma deusa dessas! ✨</h2>
        <button class="glamour-button" onclick="explodirBrilhos()">Ativar Modo Deusa ✨</button>
    </div>

    <script>
        const canvas = document.getElementById('glamour-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const shapes = ['❤️', '💎', '✨', '🌟'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GlamourParticle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || (isExplosion ? y : canvas.height + 30);
                this.isShape = !isExplosion && Math.random() < 0.25;
                this.char = shapes[Math.floor(Math.random() * shapes.length)];
                this.size = isExplosion ? Math.random() * 6 + 2 : (this.isShape ? Math.random() * 14 + 10 : Math.random() * 3 + 1);
                this.speedX = isExplosion ? (Math.random() - 0.5) * 14 : (Math.random() - 0.5) * 1.2;
                this.speedY = isExplosion ? (Math.random() - 0.5) * 14 : -Math.random() * 1.8 - 0.6;
                this.color = Math.random() > 0.4 ? '#ff007f' : '#ffd700';
                this.life = isExplosion ? 45 : 130;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2 && !this.isShape) this.size -= 0.03;
                this.life--;
            }
            draw() {
                if (this.isShape) {
                    ctx.font = `${this.size}px Arial`;
                    ctx.globalAlpha = Math.max(0, this.life / 130);
                    ctx.fillText(this.char, this.x, this.y);
                    ctx.globalAlpha = 1.0;
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function spawnAmbient() {
            if (particles.length < 50 && Math.random() < 0.09) {
                particles.push(new GlamourParticle());
            }
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            spawnAmbient();
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // Explosão majestosa de joias e brilhos néon ao clicar
        function explodirBrilhos() {
            const button = document.querySelector('.glamour-button');
            const rect = button.getBoundingClientRect();
            const posX = rect.left + rect.width / 2;
            const posY = rect.top + rect.height / 2;

            for(let i = 0; i < 60; i++) {
                particles.push(new GlamourParticle(posX, posY, true));
            }
        }
    </script>
</body>
</html>
