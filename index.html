<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta Secreta do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #18001e, #2d0036, #090011); /* Fundo cabaré neon escuro */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Elementos geométricos e emojis simbolizando três lados */
        .triangulo-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-tres {
            position: absolute;
            font-size: 2.8rem;
            bottom: -70px;
            animation: subirMisterio 5s linear infinite;
            user-select: none;
            filter: drop-shadow(0 0 10px #df127a);
        }

        /* Diferentes velocidades e posições para o trio de elementos */
        .t1 { left: 15%; animation-duration: 4s; animation-delay: 0s; }
        .t2 { left: 35%; animation-duration: 6s; animation-delay: 1.8s; font-size: 3.5rem; }
        .t3 { left: 50%; animation-duration: 4.8s; animation-delay: 0.5s; }
        .t4 { left: 72%; animation-duration: 5.5s; animation-delay: 2.2s; font-size: 4rem; }
        .t5 { left: 88%; animation-duration: 3.8s; animation-delay: 1s; }

        /* Conteúdo principal em Néon Rosa e Roxo */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarBrilho 1s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 4.5rem;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 5px;
            margin: 0;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #aa0055;
        }

        h2 {
            font-size: 2.2rem;
            color: #e0aaff;
            margin-top: 15px;
            text-shadow: 0 0 8px rgba(224, 170, 255, 0.6);
            letter-spacing: 1px;
        }

        /* Animações */
        @keyframes subirMisterio {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        @keyframes pulsarBrilho {
            0% { transform: scale(0.97); filter: drop-shadow(0 0 5px #ff007f); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 20px #ff007f); }
        }
    </style>
</head>
<body>

    <!-- Elementos visuais representando o trio flutuando ao fundo -->
    <div class="triangulo-bg">
        <div class="elemento-tres t1">😈</div>
        <div class="elemento-tres t2">💜</div>
        <div class="elemento-tres t3">😏</div>
        <div class="elemento-tres t4">📐</div> <!-- Triângulo ilustrativo da dinâmica -->
        <div class="elemento-tres t5">🔥</div>
    </div>

    <div class="conteudo">
        <h1>Ménage?</h1>
        <h2>Topa colocar mais uma pessoa na roda? 😈🔥✨</h2>
    </div>

</body>
</html>
