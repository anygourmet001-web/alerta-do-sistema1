<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #12001a, #2b0030, #4a0040); /* Fundo neon e provocante */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Elementos flutuando no fundo */
        .elementos-mamar-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-mamar {
            position: absolute;
            font-size: 2.8rem;
            bottom: -70px;
            animation: subirMamar 4.5s linear infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições diferentes para a subida */
        .m1 { left: 10%; animation-duration: 4s; animation-delay: 0s; }
        .m2 { left: 35%; animation-duration: 5.5s; animation-delay: 1.5s; font-size: 3.5rem; }
        .m3 { left: 55%; animation-duration: 4.8s; animation-delay: 0.5s; }
        .m4 { left: 75%; animation-duration: 5.2s; animation-delay: 2s; font-size: 3.2rem; }
        .m5 { left: 90%; animation-duration: 3.8s; animation-delay: 1s; }

        /* Conteúdo principal pulsante e brilhante */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarBrilhoMamar 0.8s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 4.5rem;
            color: #ffffff;
            text-shadow: 0 0 15px #d946ef, 0 0 30px #ff007f, 0 0 50px #d946ef;
            margin: 0;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        /* Animações */
        @keyframes subirMamar {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        @keyframes pulsarBrilhoMamar {
            0% { transform: scale(0.96); filter: drop-shadow(0 0 5px #ff007f); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 20px #ff007f); }
        }
    </style>
</head>
<body>

    <!-- Emojis subindo em segundo plano -->
    <div class="elementos-mamar-bg">
        <div class="elemento-mamar m1">🍭</div>
        <div class="elemento-mamar m2">🍼</div>
        <div class="elemento-mamar m3">😉</div>
        <div class="elemento-mamar m4">🍭</div>
        <div class="elemento-mamar m5">😏</div>
    </div>

    <div class="conteudo">
        <h1>Vai mamar? 🍼😏</h1>
    </div>

</body>
</html>
