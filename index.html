<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #110419, #28042a, #0b0214); /* Fundo neon escuro moderno */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Chuva de emojis subindo no fundo */
        .elementos-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-subida {
            position: absolute;
            bottom: -60px;
            font-size: 2.5rem;
            animation: subir 4s linear infinite;
            user-select: none;
        }

        /* Configuração de posições e tempos para o efeito */
        .e1 { left: 12%; animation-duration: 3.2s; animation-delay: 0s; }
        .e2 { left: 38%; animation-duration: 5s; animation-delay: 1s; font-size: 3.5rem; }
        .e3 { left: 55%; animation-duration: 4.2s; animation-delay: 0.3s; }
        .e4 { left: 78%; animation-duration: 4.8s; animation-delay: 2s; font-size: 3rem; }
        .e5 { left: 90%; animation-duration: 3.5s; animation-delay: 0.7s; }

        /* Conteúdo principal com brilho */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsar 0.7s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 4.5rem;
            color: #ffffff;
            text-shadow: 0 0 10px #a855f7, 0 0 30px #d946ef, 0 0 50px #a855f7;
            margin: 0;
            letter-spacing: 2px;
        }

        /* Animações */
        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translateY(-110vh) rotate(25deg) scale(1.1);
                opacity: 0;
            }
        }

        @keyframes pulsar {
            0% { transform: scale(0.96); filter: brightness(0.9); }
            100% { transform: scale(1.04); filter: brightness(1.1); }
        }
    </style>
</head>
<body>

    <!-- Elementos subindo em segundo plano -->
    <div class="elementos-bg">
        <div class="elemento-subida e1">🍆</div>
        <div class="elemento-subida e2">🔥</div>
        <div class="elemento-subida e3">🍆</div>
        <div class="elemento-subida e4">😏</div>
        <div class="elemento-subida e5">🔥</div>
    </div>

    <div class="conteudo">
        <h1>Pauzão! 👑</h1>
    </div>

</body>
</html>
