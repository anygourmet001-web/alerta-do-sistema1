<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta Importante do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #110000, #330000, #660011); /* Fundo provocante escuro */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Fundo interativo flutuante */
        .provocacao-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-flutuante {
            position: absolute;
            font-size: 2.5rem;
            bottom: -60px;
            animation: subirElemento 4s linear infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições diferentes */
        .p1 { left: 12%; animation-duration: 3.5s; animation-delay: 0s; }
        .p2 { left: 32%; animation-duration: 5s; animation-delay: 1.5s; font-size: 3.5rem; }
        .p3 { left: 52%; animation-duration: 4s; animation-delay: 0.5s; }
        .p4 { left: 72%; animation-duration: 4.5s; animation-delay: 2s; font-size: 3rem; }
        .p5 { left: 88%; animation-duration: 3s; animation-delay: 1s; }

        /* Conteúdo principal */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarPergunta 0.6s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 3.8rem;
            color: #ffffff;
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0000;
            margin: 0;
            line-height: 1.3;
        }

        /* Animações */
        @keyframes subirElemento {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) rotate(15deg);
                opacity: 0;
            }
        }

        @keyframes pulsarPergunta {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <!-- Elementos visuais subindo no fundo -->
    <div class="provocacao-bg">
        <div class="elemento-flutuante p1">🔥</div>
        <div class="elemento-flutuante p2">😉</div>
        <div class="elemento-flutuante p3">🔥</div>
        <div class="elemento-flutuante p4">😏</div>
        <div class="elemento-flutuante p5">🔥</div>
    </div>

    <div class="conteudo">
        <h1>Quer me dar<br>hoje? 😏🔥</h1>
    </div>

</body>
</html>
