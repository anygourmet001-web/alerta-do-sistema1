<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordem do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #0c4a6e, #0284c7, #0d9488); /* Fundo refrescante de banho */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Bolhas e elementos de banho flutuando no fundo */
        .banho-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-banho {
            position: absolute;
            font-size: 2.8rem;
            bottom: -70px;
            animation: subirBolhas 4s ease-in-out infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições diferentes para o efeito de espuma */
        .b1 { left: 10%; animation-duration: 3.5s; animation-delay: 0s; }
        .b2 { left: 32%; animation-duration: 5s; animation-delay: 1.2s; font-size: 3.5rem; }
        .b3 { left: 55%; animation-duration: 4.2s; animation-delay: 0.5s; }
        .b4 { left: 75%; animation-duration: 4.8s; animation-delay: 1.8s; font-size: 3.2rem; }
        .b5 { left: 90%; animation-duration: 3.8s; animation-delay: 0.8s; }

        /* Conteúdo principal brilhante e pulsante */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarBrilho 0.8s ease-in-out infinite alternate;
            padding: 20px;
        }

        h1 {
            font-size: 3.2rem;
            color: #ffffff;
            text-shadow: 0 0 15px #38bdf8, 0 0 30px #0ea5e9, 0 0 50px #38bdf8;
            margin: 0;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        /* Animações */
        @keyframes subirBolhas {
            0% {
                transform: translateY(0) translateX(0) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% {
                transform: translateY(-110vh) translateX(15px) scale(1.1);
                opacity: 0;
            }
        }

        @keyframes pulsarBrilho {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <!-- Elementos de banho subindo em segundo plano -->
    <div class="banho-bg">
        <div class="elemento-banho b1">🚿</div>
        <div class="elemento-banho b2">🧼</div>
        <div class="elemento-banho b3">💦</div>
        <div class="elemento-banho b4">🧼</div>
        <div class="elemento-banho b5">😏</div>
    </div>

    <div class="conteudo">
        <h1>Vai tomar banho e lava o pipiu...<br>vou te usar! 🚿🧼😏</h1>
    </div>

</body>
</html>
