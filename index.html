<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALERTA DO SISTEMA</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            animation: piscar 0.5s infinite alternate;
        }
        h2 {
            font-size: 2.2rem;
            color: yellow;
            animation: piscar 0.5s infinite alternate;
            animation-delay: 0.25s;
        }
        @keyframes piscar {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>⚠️ ALERTA !! ⚠️</h1>
    <h2>Calma Bebê, Não é virus !!</h2>
</body>
</html>
