<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Nostálgico do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #0284c7, #0369a1, #1e3a8a); /* Fundo azul clássico do desenho */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Elementos flutuantes (Machados e Pássaros) */
        .chuva-rachador-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-rachador {
            position: absolute;
            top: -75px;
            font-size: 2.5rem;
            animation: cairRachador 4s linear infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições diferentes */
        .r1 { left: 10%; animation-duration: 3.5s; animation-delay: 0s; }
        .r2 { left: 30%; animation-duration: 5s; animation-delay: 1.5s; font-size: 3rem; }
        .r3 { left: 55%; animation-duration: 4.2s; animation-delay: 0.5s; }
        .r4 { left: 78%; animation-duration: 4.8s; animation-delay: 2s; font-size: 3.5rem; }
        .r5 { left: 90%; animation-duration: 3.2s; animation-delay: 0.8s; }

        /* Conteúdo principal */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarMeme 1s ease-in-out infinite alternate;
            padding: 15px;
            max-width: 90%;
        }

        /* Estilo do GIF do Meme */
        .meme-gif {
            width: 250px;
            border: 5px solid #facc15; /* Borda amarela clássica do Pica-Pau */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
            margin-bottom: 25px;
        }

        /* Textos baseados no diálogo */
        h1 {
            font-size: 2rem;
            color: #facc15; /* Amarelo Pica-Pau */
            text-shadow: 2px 2px 8px #000;
            margin: 5px 0;
            line-height: 1.3;
        }

        h2 {
            font-size: 2.3rem;
            color: #ef4444; /* Vermelho Pica-Pau */
            text-shadow: 2px 2px 8px #000;
            margin: 10px 0;
            line-height: 1.2;
        }

        /* Animações */
        @keyframes cairRachador {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulsarMeme {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <!-- Machados e pássaros flutuando no fundo -->
    <div class="chuva-rachador-bg">
        <div class="elemento-rachador r1">🪓</div>
        <div class="elemento-rachador r2">🐦</div>
        <div class="elemento-rachador r3">🪓</div>
        <div class="elemento-rachador r4">🪵</div>
        <div class="elemento-rachador r5">🪓</div>
    </div>

    <div class="conteudo">
        <!-- GIF oficial do Pica-Pau Rachador vindo da internet -->
        <img class="meme-gif" src="https://tenor.com" alt="Pica Pau Rachador">
        
        <h1>Tô procurando rachadores...</h1>
        <h2>Rachadores? O que é? 🤔🌲</h2>
    </div>

</body>
</html>
