<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SISTEMA BIO-SCANNER</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0512;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Container de Revelação do Fundo */
        .container-revelado {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
            background: radial-gradient(circle at 50% 50%, #2e1065, #090514);
        }

        .texto-sucesso {
            width: 85%;
            max-width: 450px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            line-height: 1.4;
            margin: 0;
            text-shadow: 0 0 10px #a855f7, 0 0 25px #ff007f;
        }

        h2 {
            font-size: 3.5rem;
            color: #eab308;
            margin: 20px 0 0 0;
            text-shadow: 0 0 15px #eab308;
            animation: pulsar 0.5s infinite alternate;
        }

        /* Camada Interativa Superior (O Vidro Sujo) */
        #canvas-raspadinha {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }

        /* Instrução Flutuante Tátil */
        .instrucao-tatel {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: #22d3ee;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 8px #0891b2;
            pointer-events: none;
            animation: piscarInstrucao 0.8s infinite alternate;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid #0891b2;
        }

        @keyframes pulsar {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }

        @keyframes piscarInstrucao {
            0% { opacity: 0.3; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- O que fica escondido por baixo -->
    <div class="container-revelado">
        <div class="texto-sucesso">
            <h1>Se beleza fosse merda,<br>tu tava toda...</h1>
            <h2>CAGADA! 💩✨😅</h2>
        </div>
    </div>

    <!-- O vidro embaçado/sujo interativo para passar o dedo -->
    <canvas id="canvas-raspadinha"></canvas>
    <div class="instrucao-tatel" id="instrucao">👇 Use o dedo para limpar a tela 🧼</div>

    <script>
        const canvas = document.getElementById('canvas-raspadinha');
        const ctx = canvas.getContext('2d');
        const instrucao = document.getElementById('instrucao');
        let desenhando = false;
        let pixelsLimpos = 0;
        let jogoGanho = false;

        function inicializarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Desenha a camada de "sujeira/fumaça" realista
            ctx.fillStyle = '#1e1b4b'; // Cor base escura
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Adiciona texturas e manchas de fumaça via código
            for (let i = 0; i < 40; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let r = Math.random() * 80 + 40;
                let grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, 'rgba(115, 115, 115, 0.4)');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Texto de erro na camada superior
            ctx.font = '900 1.5rem sans-serif';
            ctx.fillStyle = '#ef4444';
            ctx.textAlign = 'center';
            ctx.fillText('⚠️ BIOMETRIA BORRADA', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '600 1rem sans-serif';
            ctx.fillStyle = '#a3a3a3';
            ctx.fillText('Limpe o sensor óptico para ler', canvas.width / 2, canvas.height / 2 + 15);
        }

        // Configuração mecânica do toque e do rastro do dedo (Scratch)
        function obterPosicaoToque(e) {
            let t = e.touches ? e.touches[0] : e;
            return { x: t.clientX, y: t.clientY };
        }

        function comecarLimpar(e) {
            desenhando = true;
            limparRastro(e);
            tocarSomBeep(440, 0.05); // Pequeno feedback tátil sonoro de início
        }

        function pararLimpar() {
            desenhando = false;
            ctx.beginPath();
            if (!jogoGanho) checarPorcentagemLimpa();
        }

        function limparRastro(e) {
            if (!desenhando || jogoGanho) return;
            e.preventDefault();
            
            let pos = obterPosicaoToque(e);
            
            // Corta a camada escura criando transparência (efeito borracha/limpeza)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 65; // Tamanho do rastro do dedo
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // Sintetizador de Áudio Nativo para criar som de vitória sem arquivos extras
        function tocarSomBeep(frequencia, duracao) {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = frequencia;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracao);
                osc.start();
                osc.stop(audioCtx.currentTime + duracao);
            } catch(err) {}
        }

        // Calcula dinamicamente o quanto da tela já foi limpo
        function checarPorcentagemLimpa() {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let totalPixels = imgData.data.length / 4;
            let pixelsTransparentes = 0;
            
            // Checa a transparência pulando pixels para não travar o celular
            for (let i = 3; i < imgData.data.length; i += 32) {
                if (imgData.data[i] === 0) {
                    pixelsTransparentes += 8;
                }
            }
            
            let porcentagem = (pixelsTransparentes / totalPixels) * 100;
            
            // Se limpou mais da metade, limpa o resto automaticamente com efeito de festa
            if (porcentagem > 45) {
                jogoGanho = true;
                instrucao.style.display = 'none';
                canvas.style.transition = 'opacity 0.8s ease';
                canvas.style.opacity = '0';
                
                // Melodia de sucesso gerada via código
                tocarSomBeep(523.25, 0.15); // Dó
                setTimeout(() => tocarSomBeep(659.25, 0.15), 150); // Mi
                setTimeout(() => tocarSomBeep(783.99, 0.3), 300); // Sol
                
                setTimeout(() => {
                    canvas.remove();
                }, 800);
            }
        }

        // Eventos para Celular (Touch) e PC (Mouse)
        canvas.addEventListener('mousedown', comecarLimpar);
        canvas.addEventListener('mousemove', limparRastro);
        window.addEventListener('mouseup', pararLimpar);

        canvas.addEventListener('touchstart', comecarLimpar, { passive: false });
        canvas.addEventListener('touchmove', limparRastro, { passive: false });
        window.addEventListener('touchend', pararLimpar);

        window.addEventListener('resize', inicializarCanvas);
        inicializarCanvas();
    </script>
</body>
</html>
