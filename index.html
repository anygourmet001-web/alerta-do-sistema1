<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SISTEMA DE PANIFICAÇÃO CRÍTICA</title>
    <style>
        :root {
            --fire-glow: #f97316;
            --bread-gold: #f59e0b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #180802;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ambient-fire {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 80%, rgba(249, 115, 22, 0.15), transparent 70%);
            z-index: 2;
            pointer-events: none;
        }

        .card-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            pointer-events: none; /* Deixa os cliques passarem para o fundo caso necessário */
        }

        .game-card {
            pointer-events: auto; /* Reativa o clique apenas dentro do card */
            width: 85%;
            max-width: 400px;
            padding: 35px 25px;
            background: rgba(36, 16, 5, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 2px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.3);
            text-align: center;
            box-sizing: border-box;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-size: 2.3rem;
            color: #ffffff;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px var(--bread-gold);
            line-height: 1.2;
        }

        h2 {
            font-size: 1.8rem;
            color: #ef4444;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .contador {
            font-size: 1.1rem;
            color: #cbd5e1;
            font-family: sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-block;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .vitoria h1 {
            color: #fde047 !important;
            text-shadow: 0 0 20px #eab308 !important;
            font-size: 2.1rem;
        }
        .vitoria h2 {
            color: #ffffff !important;
            font-size: 2.5rem !important;
            text-shadow: 0 0 15px #f97316 !important;
            animation: pulsar 0.4s infinite alternate;
            margin-top: 15px;
        }

        @keyframes pulsar {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.04); }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <div class="ambient-fire"></div>

    <div class="card-container">
        <div class="game-card" id="painel">
            <h1>Teu pai é<br>padeiro? 🥖🤔</h1>
            <h2 id="subtitulo">⚠️ Forno instável! ⚠️</h2>
            <div class="contador" id="placar">Pegue 3 roscas na tela: 0/3</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const painel = document.getElementById('painel');
        const subtitulo = document.getElementById('subtitulo');
        const placar = document.getElementById('placar');

        let objetos = [];
        let particulas = [];
        let cliques = 0;
        let finalizado = false;
        const emojis = ['🍩', '🥖', '🥐', '🥯'];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Alimento {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -50;
                this.size = Math.random() * 15 + 40;
                this.speedY = Math.random() * 3 + 3;
                this.speedX = (Math.random() - 0.5) * 4;
                this.angle = Math.random() * Math.PI;
                this.spin = (Math.random() - 0.5) * 0.05;
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                if (this.x < 20 || this.x > canvas.width - 20) this.speedX *= -1;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        class Faisca {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 12;
                this.speedY = (Math.random() - 0.5) * 12;
                this.color = Math.random() > 0.4 ? '#f97316' : '#f59e0b';
                this.life = 40;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 40;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function som(f, d) {
            try {
                let ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctxAudio.createOscillator();
                let gain = ctxAudio.createGain();
                osc.connect(gain); gain.connect(ctxAudio.destination);
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0.08, ctxAudio.currentTime);
                osc.start(); osc.stop(ctxAudio.currentTime + d);
            } catch(e) {}
        }

        // Correção da detecção de toque com suporte multitouch preciso do Android
        function processarClique(clientX, clientY) {
            if (finalizado) return;
            
            for (let i = objetos.length - 1; i >= 0; i--) {
                let obj = objetos[i];
                let dist = Math.hypot(clientX - obj.x, clientY - obj.y);
                
                if (dist < 55 && obj.emoji === '🍩') {
                    for(let p=0; p<20; p++) particulas.push(new Faisca(obj.x, obj.y));
                    objetos.splice(i, 1);
                    cliques++;
                    som(650, 0.08);
                    
                    if (cliques < 3) {
                        placar.innerText = `Pegue 3 roscas na tela: ${cliques}/3`;
                    } else {
                        vitoriaGeral();
                    }
                    break;
                }
            }
        }

        function vitoriaGeral() {
            finalizado = true;
            placar.style.display = 'none';
            subtitulo.style.display = 'none';
            painel.classList.add('vitoria');
            painel.querySelector('h1').innerHTML = "Porque eu queria<br>saber...";
            
            setTimeout(() => {
                let h2 = document.createElement('h2');
                h2.innerText = "SE ELE QUEIMA A ROSCA! 🍩🔥🤣";
                painel.appendChild(h2);
                
                som(440, 0.12);
                setTimeout(() => som(554.37, 0.12), 120);
                setTimeout(() => som(659.25, 0.35), 240);
                
                let rect = painel.getBoundingClientRect();
                for(let k=0; k<80; k++) {
                    particulas.push(new Faisca(rect.left + rect.width/2, rect.top + rect.height/2));
                }
            }, 500);
        }

        // Correção estrutural dos listeners táteis para capturar as coordenadas certas no Android
        window.addEventListener('touchstart', (e) => {
            if(e.touches && e.touches[0]) {
                processarClique(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('mousedown', (e) => {
            processarClique(e.clientX, e.clientY);
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!finalizado && objetos.length < 12 && Math.random() < 0.05) {
                objetos.push(new Alimento());
            }

            for (let i = objetos.length - 1; i >= 0; i--) {
                objetos[i].update();
                objetos[i].draw();
                if (objetos[i].y > canvas.height + 50) objetos.splice(i, 1);
            }

            for (let i = particulas.length - 1; i >= 0; i--) {
                particulas[i].update();
                particulas[i].draw();
                if (particulas[i].life <= 0) particulas.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
