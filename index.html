<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaração do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e0b1c, #4c0519, #831843); /* Fundo romântico escuro */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Container de corações flutuantes */
        .coracoes-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .coracao-css {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background-color: #f43f5e;
            transform: rotate(-45deg);
            bottom: -50px;
            animation: subir 6s linear infinite;
        }

        .coracao-css::before,
        .coracao-css::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #f43f5e;
            border-radius: 50%;
        }

        .coracao-css::before {
            top: -10px;
            left: 0;
        }

        .coracao-css::after {
            top: 0;
            left: 10px;
        }

        /* Configuração de posições e tempos diferentes para os corações */
        .c1 { left: 10%; animation-duration: 5s; animation-delay: 0s; scale: 0.8; }
        .c2 { left: 30%; animation-duration: 7s; animation-delay: 2s; scale: 1.2; background-color: #ec4899; }
        .c2::before, .c2::after { background-color: #ec4899; }
        .c3 { left: 55%; animation-duration: 6s; animation-delay: 1s; scale: 1; }
        .c4 { left: 75%; animation-duration: 8s; animation-delay: 3s; scale: 1.5; background-color: #f43f5e; }
        .c5 { left: 90%; animation-duration: 5s; animation-delay: 0.5s; scale: 0.7; background-color: #fda4af; }
        .c5::before, .c5::after { background-color: #fda4af; }

        /* Conteúdo principal */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsar 1s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #f43f5e, 0 0 30px #f43f5e;
            margin: 0;
        }

        span {
            font-size: 5rem;
            display: block;
            margin-top: 15px;
        }

        /* Animações */
        @keyframes subir {
            0% {
                transform: translateY(0) rotate(-45deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(-45deg);
                opacity: 0;
            }
        }

        @keyframes pulsar {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- Corações Gerados por CSS flutuando no fundo -->
    <div class="coracoes-bg">
        <div class="coracao-css c1"></div>
        <div class="coracao-css c2"></div>
        <div class="coracao-css c3"></div>
        <div class="coracao-css c4"></div>
        <div class="coracao-css c5"></div>
    </div>

    <div class="conteudo">
        <h1>Te Amoooo</h1>
        <span>❤️🥰❤️</span>
    </div>

</body>
</html>
