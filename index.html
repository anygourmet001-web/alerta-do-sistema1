<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦴 ALERTA DE BEDROCK 🦴</title>
    <style>
        :root {
            --stone-orange: #f97316;
            --stone-yellow: #eab308;
            --cave-dark: #1c1917;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1c1917; /* Fundo cor de caverna profunda */
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sistema de partículas (Pedras, Ossos e Faíscas) */
        #cave-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.15), transparent 70%);
            z-index: 2;
            pointer-events: none;
        }

        /* Card Interface Cave-Glassmorphism */
        .cave-card {
            position: relative;
            z-index: 3;
            width: 85%;
            max-width: 400px;
            padding: 40px 25px;
            background: rgba(28, 25, 23, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 3px solid rgba(249, 115, 22, 0.5);
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.3), inset 0 0 20px rgba(234, 179, 8, 0.1);
            text-align: center;
            animation: flutuarCard 3.5s ease-in-out infinite alternate;
        }

        /* Ilustração do Tacape/Clava em CSS */
        .clava-visual {
            width: 40px;
            height: 80px;
            background: linear-gradient(to bottom, #78350f, #451a03);
            border-radius: 20px 20px 10px 10px;
            margin: 0 auto 20px auto;
            position: relative;
            transform: rotate(15deg);
            animation: balancarClava 0.6s ease-in-out infinite alternate;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }
        .clava-visual::after {
            content: '🦴';
            position: absolute;
            font-size: 1.2rem;
            top: 20px;
            left: 8px;
        }

        /* Tipografia de Impacto Pré-Histórico */
        h1 {
            font-size: 2.8rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 25px var(--stone-orange);
            line-height: 1.1;
        }

        h2 {
            font-size: 1.4rem;
            color: var(--stone-yellow);
            margin: 15px 0 30px 0;
            font-family: sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }

        /* Botão Primitivo Premium */
        .cave-button {
            background: linear-gradient(45deg, var(--stone-orange), #dc2626);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            letter-spacing: 1px;
        }

        .cave-button:active {
            transform: scale(0.96);
            box-shadow: 0 0 25px var(--stone-yellow);
        }

        /* Tela balançando (Terremoto) */
        .terremoto {
            animation: tremerTela 0.3s linear infinite !important;
        }

        /* Animações */
        @keyframes flutuarCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); border-color: var(--stone-yellow); box-shadow: 0 0 50px rgba(234, 179, 8, 0.3); }
        }

        @keyframes balancarClava {
            0% { transform: rotate(10deg); }
            100% { transform: rotate(35deg); }
        }

        @keyframes tremerTela {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10deg { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <!-- Canvas de Partículas Rústicas -->
    <canvas id="cave-canvas"></canvas>
    <div class="ambient-glow"></div>

    <!-- Interface Premium Flintstones -->
    <div class="cave-card" id="main-card">
        <div class="clava-visual"></div>
        <h1>IABA DABA<br>DUUUUU!</h1>
        <h2>YABBA DABBA DOO! 🍖🦖</h2>
        <button class="cave-button" onclick="dispararTerremoto()">Gritar junto! 📢</button>
    </div>

    <script>
        const canvas = document.getElementById('cave-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const emojis = ['🪨', '🦴', '🔥', '✨'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class CaveParticle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || (isExplosion ? y : canvas.height + 30);
                this.isText = !isExplosion && Math.random() < 0.3;
                this.char = emojis[Math.floor(Math.random() * emojis.length)];
                this.size = isExplosion ? Math.random() * 5 + 2 : (this.isText ? Math.random() * 12 + 12 : Math.random() * 3 + 1);
                this.speedX = isExplosion ? (Math.random() - 0.5) * 12 : (Math.random() - 0.5) * 1;
                this.speedY = isExplosion ? (Math.random() - 0.5) * 12 : -Math.random() * 1.5 - 0.5;
                this.color = Math.random() > 0.5 ? '#f97316' : '#eab308';
                this.life = isExplosion ? 35 : 120;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2 && !this.isText) this.size -= 0.03;
                this.life--;
            }
            draw() {
                if (this.isText) {
                    ctx.font = `${this.size}px Arial`;
                    ctx.globalAlpha = Math.max(0, this.life / 120);
                    ctx.fillText(this.char, this.x, this.y);
                    ctx.globalAlpha = 1.0;
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function spawnAmbient() {
            if (particles.length < 40 && Math.random() < 0.08) {
                particles.push(new CaveParticle());
            }
        }

        function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            spawnAmbient();
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(drawLoop);
        }
        drawLoop();

        // Efeito interativo de terremoto com chuva de fragmentos
        function dispararTerremoto() {
            const card = document.getElementById('main-card');
            card.classList.add('terremoto');
            
            const rect = card.getBoundingClientRect();
            const posX = rect.left + rect.width / 2;
            const posY = rect.top + rect.height / 2;

            for(let i = 0; i < 50; i++) {
                particles.push(new CaveParticle(posX, posY, true));
            }

            setTimeout(() => {
                card.classList.remove('terremoto');
            }, 600);
        }
    </script>
</body>
</html>
