<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Força Maior</title>
    <style>
        body {
            background: linear-gradient(135deg, #2c1a11, #4a2c11, #1a0f0a); /* Fundo temático marrom escuro */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Chuva de elementos cômicos no fundo */
        .chuva-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-queda {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            animation: cair 4s linear infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições diferentes para a queda */
        .e1 { left: 15%; animation-duration: 3.5s; animation-delay: 0s; }
        .e2 { left: 35%; animation-duration: 5s; animation-delay: 1.5s; font-size: 2.5rem; }
        .e3 { left: 55%; animation-duration: 4s; animation-delay: 0.5s; }
        .e4 { left: 75%; animation-duration: 4.5s; animation-delay: 2s; font-size: 3rem; }
        .e5 { left: 85%; animation-duration: 3s; animation-delay: 1s; }

        /* Conteúdo principal */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: balancar 0.5s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 3.5rem;
            color: #d7ccc8;
            text-shadow: 0 0 15px #8d6e63, 0 0 30px #5d4037;
            margin: 0;
        }

        h2 {
            font-size: 2.2rem;
            color: #ffb74d; /* Laranja de aviso */
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(255, 183, 77, 0.5);
        }

        /* Animações */
        @keyframes cair {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes balancar {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }
    </style>
</head>
<body>

    <!-- Chuva de emojis caindo no fundo -->
    <div class="chuva-bg">
        <div class="elemento-queda e1">💩</div>
        <div class="elemento-queda e2">🧻</div>
        <div class="elemento-queda e3">💩</div>
        <div class="elemento-queda e4">🧻</div>
        <div class="elemento-queda e5">💩</div>
    </div>

    <div class="conteudo">
        <h1>Fui Cagar!</h1>
        <h2>Me dá 5 minutinhos ⏳🚪</h2>
    </div>

</body>
</html>
