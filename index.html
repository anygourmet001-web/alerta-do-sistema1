<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #0369a1, #0d9488); /* Fundo refrescante e aquático */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Chuva de elementos de urgência no fundo */
        .chuva-xixi-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-xixi {
            position: absolute;
            top: -60px;
            font-size: 2.5rem;
            animation: cairUrgente 3s linear infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições diferentes para a chuva */
        .x1 { left: 10%; animation-duration: 2.5s; animation-delay: 0s; }
        .x2 { left: 32%; animation-duration: 4s; animation-delay: 1s; font-size: 3rem; }
        .x3 { left: 55%; animation-duration: 3.2s; animation-delay: 0.5s; }
        .x4 { left: 75%; animation-duration: 3.8s; animation-delay: 1.5s; font-size: 3.5rem; }
        .x5 { left: 90%; animation-duration: 2.8s; animation-delay: 0.7s; }

        /* Conteúdo principal simulando o movimento de estar apertado */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: dancinhaApertado 0.4s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 3.5rem;
            color: #e0f2fe;
            text-shadow: 0 0 15px #38bdf8, 0 0 30px #0284c7;
            margin: 0;
            line-height: 1.2;
        }

        h2 {
            font-size: 2.2rem;
            color: #ccfbf1;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(13, 148, 136, 0.5);
        }

        /* Animações */
        @keyframes cairUrgente {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translateY(110vh) rotate(180deg);
                opacity: 0;
            }
        }

        /* Animação que balança o texto imitando a pessoa apertada */
        @keyframes dancinhaApertado {
            0% { transform: translateX(-8px) translateY(2px) rotate(-1deg); }
            100% { transform: translateX(8px) translateY(-2px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <!-- Emojis caindo no fundo -->
    <div class="chuva-xixi-bg">
        <div class="elemento-xixi x1">💦</div>
        <div class="elemento-xixi x2">🏃‍♂️</div>
        <div class="elemento-xixi x3">🚽</div>
        <div class="elemento-xixi x4">💦</div>
        <div class="elemento-xixi x5">🏃‍♂️</div>
    </div>

    <div class="conteudo">
        <h1>Tô Apertado!</h1>
        <h2>Vou fazer xixi correndo! 💦🏃‍♂️🚽</h2>
    </div>

</body>
</html>
