<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏦 BANCO CENTRAL - INTRUSÃO 🏦</title>
    <style>
        :root {
            --bella-red: #dc2626;
            --gold-vault: #ca8a04;
            --metal-grey: #475569;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f1115;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #vault-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interface-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        /* Card de Segurança Máxima */
        .vault-card {
            pointer-events: auto;
            width: 85%;
            max-width: 400px;
            padding: 35px 20px;
            background: rgba(15, 17, 21, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 2px solid rgba(220, 38, 38, 0.4);
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.25);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            color: #ffffff;
            margin: 0 0 5px 0;
            text-shadow: 0 0 15px var(--bella-red);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 1.1rem;
            color: #94a3b8;
            font-family: sans-serif;
            margin: 0 0 25px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ILUSTRAÇÃO DA MAÇANETA DO COFRE EM CSS */
        .macaneta-container {
            width: 140px;
            height: 140px;
            margin-bottom: 25px;
            position: relative;
            cursor: pointer;
            touch-action: none;
        }

        .roda-aco {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #64748b 20%, #334155 60%, #1e293b 100%);
            border-radius: 50%;
            border: 6px solid var(--metal-grey);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.2);
            position: absolute;
            transition: transform 0.1s linear;
        }

        /* Raios da roda do cofre */
        .raio {
            position: absolute;
            width: 12px;
            height: 140px;
            background: #475569;
            left: 64px;
            top: 0;
            border-radius: 6px;
        }
        .raio-2 { transform: rotate(45deg); }
        .raio-3 { transform: rotate(90deg); }
        .raio-4 { transform: rotate(135deg); }

        .centro-roda {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #1e293b;
            border: 4px solid var(--bella-red);
            border-radius: 50%;
            top: 45px;
            left: 45px;
            z-index: 5;
            box-shadow: 0 0 10px var(--bella-red);
        }

        .progresso-texto {
            font-size: 0.95rem;
            color: #ef4444;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(220, 38, 38, 0.2);
            font-family: sans-serif;
            letter-spacing: 1px;
        }

        /* Vitória */
        .arrombado {
            border-color: var(--gold-vault) !important;
            box-shadow: 0 0 50px rgba(202, 138, 4, 0.4) !important;
        }
        .arrombado h1 {
            color: #ffffff !important;
            text-shadow: 0 0 20px var(--gold-vault) !important;
            font-size: 2.3rem !important;
        }
        .arrombado h2 {
            color: #fde047 !important;
            font-size: 1.8rem !important;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 0 15px rgba(252, 211, 77, 0.5) !important;
            margin: 15px 0 0 0 !important;
        }
    </style>
</head>
<body>

    <canvas id="vault-canvas"></canvas>

    <div class="interface-layer">
        <div class="vault-card" id="painel">
            <h1 id="titulo">Plano de Assalto</h1>
            <h2 id="subtitulo">Gire a tranca para abrir</h2>
            
            <div class="macaneta-container" id="tranca-interativa">
                <div class="roda-aco" id="roda">
                    <div class="raio raio-1"></div>
                    <div class="raio raio-2"></div>
                    <div class="raio raio-3"></div>
                    <div class="raio raio-4"></div>
                </div>
                <div class="centro-roda"></div>
            </div>

            <div class="progresso-texto" id="status-trava">Progresso seguro: 0%</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('vault-canvas');
        const ctx = canvas.getContext('2d');
        const roda = document.getElementById('roda');
        const painel = document.getElementById('painel');
        const statusTrava = document.getElementById('status-trava');
        const subtitulo = document.getElementById('subtitulo');
        const tranca = document.getElementById('tranca-interativa');

        let dinheiro = [];
        let totalGiro = 0;
        let finalizado = false;
        let anguloAnterior = 0;
        let girando = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Classe de dinheiro físico caindo após o estouro
        class Cedula {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -60;
                this.w = 55;
                this.h = 26;
                this.vy = Math.random() * 2 + 3;
                this.vx = (Math.random() - 0.5) * 2;
                this.angle = Math.random() * Math.PI;
                this.spin = (Math.random() - 0.5) * 0.05;
            }
            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.angle += this.spin;
                this.vx += Math.sin(this.y / 30) * 0.05; // Efeito de folha ao vento
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                // Desenha uma cédula de dinheiro verde com CSS Canvas
                ctx.fillStyle = '#15803d';
                ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                ctx.strokeStyle = '#bbf7d0';
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.w/2 + 2, -this.h/2 + 2, this.w - 4, this.h - 4);
                ctx.fillStyle = '#bbf7d0';
                ctx.font = '10px sans-serif';
                ctx.fillText('💵', -10, 4);
                ctx.restore();
            }
        }

        function somClick(freq, dur) {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        // Mecânica de rotação matemática usando ArcoTangente2
        function obterAngulo(clientX, clientY) {
            let rect = tranca.getBoundingClientRect();
            let centroX = rect.left + rect.width / 2;
            let centroY = rect.top + rect.height / 2;
            return Math.atan2(clientY - centroY, clientX - centroX);
        }

        function iniciarGiro(e) {
            if (finalizado) return;
            girando = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            anguloAnterior = obterAngulo(clientX, clientY);
        }

        function executarGiro(e) {
            if (!girando || finalizado) return;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let anguloAtual = obterAngulo(clientX, clientY);
            let diferenca = anguloAtual - anguloAnterior;

            // Corrige quebra de quadrantes de rotação
            if (diferenca > Math.PI) diferenca -= Math.PI * 2;
            if (diferenca < -Math.PI) diferenca += Math.PI * 2;

            totalGiro += Math.abs(diferenca);
            anguloAnterior = anguloAtual;

            // Gira a roda visualmente
            roda.style.transform = `rotate(${totalGiro * (180 / Math.PI)}deg)`;

            let progresso = Math.min(100, Math.floor((totalGiro / (Math.PI * 6)) * 100));
            statusTrava.innerText = `Progresso seguro: ${progresso}%`;

            // Som de catraca metálica engatando
            if (Math.random() < 0.15) somClick(120, 0.03);

            if (totalGiro >= Math.PI * 6) {
