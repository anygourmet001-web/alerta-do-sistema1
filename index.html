<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dorama — Seu Destino</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
        radial-gradient(circle at 50% 20%, #ffe8f1 0%, transparent 35%),
        linear-gradient(145deg,#170b1f,#3b102e,#120914);
    color:white;
    position:relative;
}

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.petal{
    position:absolute;
    top:-40px;
    font-size:20px;
    animation:fall linear forwards;
    opacity:.9;
}

@keyframes fall{
    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:0;
    }
    10%{opacity:1;}
    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:.15;
    }
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:22px;
    position:relative;
    z-index:2;
}

.card{
    width:min(430px,100%);
    min-height:560px;
    border-radius:30px;
    padding:30px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.18);
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.12);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.kdrama{
    font-size:14px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#ffc8dd;
    margin-bottom:18px;
}

.title{
    font-size:42px;
    line-height:1.02;
    font-weight:900;
    margin-bottom:16px;

    text-shadow:
        0 0 15px rgba(255,126,180,.35);
}

.subtitle{
    font-size:17px;
    line-height:1.5;
    color:#f4dfe9;
    margin-bottom:28px;
}

.heart{
    font-size:72px;
    margin-bottom:20px;
    animation:heartbeat 1.3s infinite;
    filter:drop-shadow(0 0 15px rgba(255,80,150,.7));
}

@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    15%{transform:scale(1.14);}
    30%{transform:scale(1);}
    45%{transform:scale(1.08);}
    60%{transform:scale(1);}
}

button{
    width:100%;
    max-width:330px;
    border:none;
    border-radius:18px;
    padding:17px 20px;
    margin:8px 0;

    font-size:17px;
    font-weight:800;
    color:white;

    background:linear-gradient(135deg,#ff4f91,#a92d68);

    box-shadow:
        0 10px 30px rgba(255,55,140,.3),
        inset 0 1px 0 rgba(255,255,255,.2);

    cursor:pointer;
    transition:.18s;
}

button:active{
    transform:scale(.95);
}

.choice{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.13);
}

.choice:hover{
    background:rgba(255,255,255,.15);
}

.hidden{
    display:none!important;
}

.question{
    font-size:27px;
    line-height:1.2;
    font-weight:800;
    margin-bottom:25px;
}

.progress{
    width:100%;
    max-width:330px;
    height:6px;
    border-radius:10px;
    background:rgba(255,255,255,.12);
    margin-bottom:25px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff5c9d,#ffd0e2);
    transition:.5s;
}

.resultEmoji{
    font-size:80px;
    margin-bottom:15px;
    animation:pop .6s ease;
}

@keyframes pop{
    0%{transform:scale(.2);opacity:0}
    70%{transform:scale(1.15)}
    100%{transform:scale(1)}
}

.resultTitle{
    font-size:34px;
    font-weight:900;
    margin-bottom:15px;
}

.resultText{
    font-size:17px;
    line-height:1.55;
    color:#f5dfe9;
    margin-bottom:25px;
}

.doramaBadge{
    padding:9px 16px;
    border-radius:30px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.15);
    color:#ffd1e3;
    font-size:13px;
    margin-bottom:22px;
}

.flash{
    animation:flash .45s;
}

@keyframes flash{
    0%{filter:brightness(1)}
    50%{filter:brightness(2)}
    100%{filter:brightness(1)}
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="screen">

    <!-- INÍCIO -->
    <div class="card" id="start">

        <div class="heart">💗</div>

        <div class="kdrama">
            K-DRAMA EXPERIENCE
        </div>

        <div class="title">
            Seu destino<br>
            de dorama
        </div>

        <div class="subtitle">
            Prepare o coração...<br>
            algumas escolhas podem mudar<br>
            completamente essa história. 👀
        </div>

        <button onclick="startGame()">
            🎬 COMEÇAR O DORAMA
        </button>

    </div>


    <!-- JOGO -->
    <div class="card hidden" id="game">

        <div class="doramaBadge" id="badge">
            EPISÓDIO 1
        </div>

        <div class="progress">
            <div class="progressBar" id="progress"></div>
        </div>

        <div class="question" id="question">
            Você está andando pela rua...
        </div>

        <div id="choices"></div>

    </div>


    <!-- RESULTADO -->
    <div class="card hidden" id="result">

        <div class="resultEmoji" id="resultEmoji">
            💕
        </div>

        <div class="resultTitle" id="resultTitle">
            Seu dorama começou!
        </div>

        <div class="resultText" id="resultText">
            ...
        </div>

        <div class="doramaBadge" id="resultBadge">
            FINAL DO EPISÓDIO
        </div>

        <button onclick="restart()">
            🔄 ASSISTIR DE NOVO
        </button>

    </div>

</div>

<script>

const particles = document.getElementById("particles");

const emojis = [
    "🌸","🌸","💗","💕","✨","💮","💖","🌷"
];

function createPetal(){

    const el = document.createElement("div");

    el.className="petal";

    el.textContent =
        emojis[Math.floor(Math.random()*emojis.length)];

    el.style.left =
        Math.random()*100+"vw";

    el.style.fontSize =
        (14+Math.random()*18)+"px";

    el.style.animationDuration =
        (5+Math.random()*7)+"s";

    el.style.animationDelay =
        Math.random()*2+"s";

    particles.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },14000);
}

setInterval(createPetal,350);

for(let i=0;i<12;i++){
    setTimeout(createPetal,i*200);
}


const perguntas = [

{
    pergunta:"Você está andando pela rua quando um oppa esbarra em você. O que você faz?",
    opcoes:[
        ["😳 Fico olhando pra ele sem conseguir falar","romance"],
        ["😂 Dou risada e sigo andando","comedia"],
        ["🔥 Olho de volta e digo: 'Foi de propósito?'","ousada"]
    ]
},

{
    pergunta:"Ele aparece novamente no mesmo lugar no dia seguinte...",
    opcoes:[
        ["💕 Acho que o destino está tentando dizer alguma coisa","romance"],
        ["👀 Começo a investigar quem ele é","misterio"],
        ["😂 Já considero isso o começo de um dorama","comedia"]
    ]
},

{
    pergunta:"Ele pergunta: 'Você acredita em destino?'",
    opcoes:[
        ["💗 Sim... talvez você seja meu destino","romance"],
        ["😏 Depende. O que você está planejando?","ousada"],
        ["😂 Só se tiver 16 episódios","comedia"]
    ]
},

{
    pergunta:"Ele segura sua mão e diz que precisa contar um segredo...",
    opcoes:[
        ["🥹 Escuto atentamente","romance"],
        ["👀 'Agora fiquei curiosa...'","misterio"],
        ["🔥 'Só se o segredo for interessante'","ousada"]
    ]
}

];

let perguntaAtual=0;
let escolhas=[];

function startGame(){

    document.getElementById("start").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    perguntaAtual=0;
    escolhas=[];

    mostrarPergunta();
}

function mostrarPergunta(){

    const p=perguntas[perguntaAtual];

    document.getElementById("question").textContent=p.pergunta;

    document.getElementById("badge").textContent=
        "EPISÓDIO "+(perguntaAtual+1);

    document.getElementById("progress").style.width=
        ((perguntaAtual)/perguntas.length*100)+"%";

    const container=document.getElementById("choices");

    container.innerHTML="";

    p.opcoes.forEach(opcao=>{

        const btn=document.createElement("button");

        btn.className="choice";

        btn.textContent=opcao[0];

        btn.onclick=()=>{

            escolhas.push(opcao[1]);

            btn.classList.add("flash");

            if(navigator.vibrate){
                navigator.vibrate(35);
            }

            setTimeout(()=>{

                perguntaAtual++;

                if(perguntaAtual>=perguntas.length){

                    mostrarResultado();

                }else{

                    mostrarPergunta();

                }

            },180);

        };

        container.appendChild(btn);

    });
}


function mostrarResultado(){

    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    let contagem={
        romance:0,
        comedia:0,
        ousada:0,
        misterio:0
    };

    escolhas.forEach(e=>{
        contagem[e]++;
    });

    let tipo=
        Object.keys(contagem)
        .sort((a,b)=>contagem[b]-contagem[a])[0];

    const resultados={

        romance:{
            emoji:"💗",
            titulo:"VOCÊ É A PROTAGONISTA!",
            texto:
            "Seu dorama seria aquele romance que começa devagar... com olhares demorados, encontros por acaso e uma trilha sonora que faz qualquer pessoa suspirar. 🌸<br><br>O problema é que o oppa já percebeu que está apaixonado. 👀",
            badge:"ROMANCE • 16 EPISÓDIOS"
        },

        comedia:{
            emoji:"😂",
            titulo:"ROM-COM LIBERADA!",
            texto:
            "No seu dorama ninguém consegue ficar sério por mais de cinco minutos. 😂<br><br>Você tropeça, ele ri, vocês brigam, fazem as pazes... e inexplicavelmente terminam apaixonados.",
            badge:"COMÉDIA ROMÂNTICA"
        },

        ousada:{
            emoji:"🔥",
            titulo:"VOCÊ QUEBROU O ROTEIRO!",
            texto:
            "A protagonista aqui não espera o oppa tomar iniciativa. 😏🔥<br><br>O roteiro tinha uma história planejada... mas você simplesmente decidiu improvisar.",
            badge:"ROMANCE • PROTAGONISTA PERIGOSA"
        },

        misterio:{
            emoji:"👀",
            titulo:"DORAMA DE MISTÉRIO!",
            texto:
            "Tem alguma coisa estranha acontecendo. 👀<br><br>Você percebe detalhes que ninguém percebe e começa a descobrir que aquele encontro talvez não tenha sido por acaso...",
            badge:"MISTÉRIO • ROMANCE"
        }

    };

    const r=resultados[tipo];

    document.getElementById("resultEmoji").textContent=r.emoji;
    document.getElementById("resultTitle").textContent=r.titulo;
    document.getElementById("resultText").innerHTML=r.texto;
    document.getElementById("resultBadge").textContent=r.badge;

    if(navigator.vibrate){
        navigator.vibrate([60,40,100]);
    }

    explosao();

}


function explosao(){

    for(let i=0;i<25;i++){

        const el=document.createElement("div");

        el.textContent=
            emojis[Math.floor(Math.random()*emojis.length)];

        el.style.position="fixed";
        el.style.left="50%";
        el.style.top="50%";
        el.style.fontSize=(15+Math.random()*20)+"px";
        el.style.pointerEvents="none";
        el.style.zIndex="10";

        const x=(Math.random()*600-300);
        const y=(Math.random()*900-450);

        el.style.transition="transform 1.2s ease, opacity 1.2s ease";

        document.body.appendChild(el);

        requestAnimationFrame(()=>{

            el.style.transform=
                `translate(${x}px,${y}px) rotate(${Math.random()*720}deg)`;

            el.style.opacity="0";

        });

        setTimeout(()=>el.remove(),1300);
    }
}


function restart(){

    document.getElementById("result").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    perguntaAtual=0;
    escolhas=[];

    mostrarPergunta();
}

</script>

</body>
</html>
