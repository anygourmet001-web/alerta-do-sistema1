<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta Secreta do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #1c0024, #42001c, #0a0014); /* Estilo lounge escuro provocante */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Fundo com geometria de três lados e elementos flutuantes */
        .trio-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .elemento-trio {
            position: absolute;
            font-size: 2.8rem;
            bottom: -70px;
            animation: subirTrio 5s linear infinite;
            user-select: none;
            filter: drop-shadow(0 0 10px #ff0055);
        }

        /* Configuração de tempos e posições diferentes para a subida */
        .t1 { left: 10%; animation-duration: 4.2s; animation-delay: 0s; }
        .t2 { left: 30%; animation-duration: 5.8s; animation-delay: 1.2s; font-size: 3.5rem; }
        .t3 { left: 52%; animation-duration: 4.5s; animation-delay: 0.5s; }
        .t4 { left: 74%; animation-duration: 5.2s; animation-delay: 2s; font-size: 3.2rem; }
        .t5 { left: 90%; animation-duration: 3.9s; animation-delay: 0.8s; }

        /* Conteúdo principal pulsante e brilhante */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarBrilho 0.8s ease-in-out infinite alternate;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 0 0 15px #f43f5e, 0 0 30px #d946ef, 0 0 50px #f43f5e;
            margin: 0;
            letter-spacing: 2px;
            line-height: 1.4;
        }

        /* Animações */
        @keyframes subirTrio {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        @keyframes pulsarBrilho {
            0% { transform: scale(0.96); filter: drop-shadow(0 0 5px #f43f5e); }
            100% { transform: scale(1.04 filter: drop-shadow(0 0 20px #f43f5e); }
        }
    </style>
</head>
<body>

    <!-- Elementos visuais simbolizando o trio flutuando ao fundo -->
    <div class="trio-bg">
        <div class="elemento-trio t1">😏</div>
        <div class="elemento-trio t2">📐</div> <!-- Triângulo ilustrativo -->
        <div class="elemento-trio t3">🔥</div>
        <div class="elemento-trio t4">😈</div>
        <div class="elemento-trio t5">😏</div>
    </div>

    <div class="conteudo">
        <h1>Eu, tu e teu amigo...<br>bora? 😈🔥📐</h1>
    </div>

</body>
</html>
