<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Doce</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffe4e6, #fbcfe8, #f472b6); /* Fundo rosa morango fofinho */
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Chuva de doces e morangos no fundo */
        .doces-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .doce-elemento {
            position: absolute;
            font-size: 2.5rem;
            bottom: -70px;
            animation: subirDoce 4.5s linear infinite;
            user-select: none;
        }

        .d1 { left: 12%; animation-duration: 4s; animation-delay: 0s; }
        .d2 { left: 35%; animation-duration: 5.5s; animation-delay: 1.5s; font-size: 3.2rem; }
        .d3 { left: 58%; animation-duration: 4.8s; animation-delay: 0.5s; }
        .d4 { left: 78%; animation-duration: 5.2s; animation-delay: 2.2s; font-size: 3.5rem; }
        .d5 { left: 91%; animation-duration: 3.8s; animation-delay: 1s; }

        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarMeme 1s ease-in-out infinite alternate;
            padding: 15px;
            max-width: 90%;
        }

        /* Estilo do GIF - Agora puxando localmente */
        .meme-gif {
            width: 250px;
            border: 6px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(219, 39, 119, 0.4);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 0 4px 10px #db2777, 0 0 20px #db2777;
            margin: 5px 0;
            line-height: 1.2;
        }

        h2 {
            font-size: 2rem;
            color: #fdf2e9;
            text-shadow: 0 3px 8px #be185d;
            margin: 10px 0;
        }

        @keyframes subirDoce {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        @keyframes pulsarMeme {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <div class="doces-bg">
        <div class="doce-elemento d1">🍓</div>
        <div class="doce-elemento d2">🍰</div>
        <div class="doce-elemento d3">🍓</div>
        <div class="doce-elemento d4">🍰</div>
        <div class="doce-elemento d5">🍓</div>
    </div>

    <div class="conteudo">
        <!-- Tag corrigida apontando para o arquivo que está na sua pasta -->
        <img class="meme-gif" src="gatinho.gif" alt="Bolo de Morango">
        
        <h1>Hummmm... 🍓</h1>
        <h2>Bolo de muranguu! 🍰✨</h2>
    </div>

</body>
</html>
