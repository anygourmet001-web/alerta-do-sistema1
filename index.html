<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 ALERTA GERAL DO SISTEMA 🚨</title>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-purple: #9d4edd;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0512;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fundo com efeito de partículas e degradê animado */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .background-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(157, 78, 221, 0.15), transparent 60%);
            z-index: 2;
            pointer-events: none;
        }

        /* Card Interface Premium Glassmorphism */
        .premium-card {
            position: relative;
            z-index: 3;
            width: 85%;
            max-width: 400px;
            padding: 35px 25px;
            background: rgba(15, 10, 25, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.1);
            text-align: center;
            animation: flutuarCard 4s ease-in-out infinite alternate;
        }

        /* Ícone de Alerta Neon */
        .neon-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: vibrarIcone 0.3s linear infinite alternate;
            display: inline-block;
            filter: drop-shadow(0 0 10px var(--neon-pink));
        }

        /* Tipografia Customizada de Alto Impacto */
        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px var(--neon-pink);
        }

        h2 {
            font-size: 1.8rem;
            color: var(--neon-blue);
            margin: 0 0 25px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            font-weight: 900;
        }

        /* Botão Interativo Premium */
        .premium-button {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-pink);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            letter-spacing: 1px;
        }

        .premium-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 35px var(--neon-blue);
        }

        /* Animações Avançadas */
        @keyframes flutuarCard {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(1deg); border-color: var(--neon-blue); box-shadow: 0 0 50px rgba(0, 240, 255, 0.25); }
        }

        @keyframes vibrarIcone {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.08) rotate(3deg); }
        }
    </style>
</head>
<body>

    <!-- Sistema de Partículas Avançado em segundo plano -->
    <canvas id="particle-canvas"></canvas>
    <div class="background-glow"></div>

    <!-- Interface Premium -->
    <div class="premium-card">
        <div class="neon-icon">🔥🛑</div>
        <h1>Meu marido</h1>
        <h2>n quer me dar! 😩👿</h2>
        <button class="premium-button" onclick="gerarExplosao()">Reclamar com ele! ⚡</button>
    </div>

    <script>
        // SCRIPT DE PARTÍCULAS INTERATIVAS (CANVAS)
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || (isExplosion ? y : canvas.height + 20);
                this.size = Math.random() * (isExplosion ? 6 : 3) + 1;
                this.speedX = isExplosion ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 1.5;
                this.speedY = isExplosion ? (Math.random() - 0.5) * 8 : -Math.random() * 2 - 0.5;
                this.color = isExplosion 
                    ? (Math.random() > 0.5 ? '#ff007f' : '#00f0ff') 
                    : `rgba(${Math.random() > 0.5 ? '255,0,127' : '0,240,255'}, ${Math.random() * 0.4 + 0.2})`;
                this.life = isExplosion ? 40 : 100;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.1) this.size -= 0.04;
                this.life--;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            if (particles.length < 60 && Math.random() < 0.1) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            initParticles();
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0 || particles[i].size <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Efeito de explosão de fogos digitais ao tocar no botão interativo
        function gerarExplosao() {
            const rect = document.querySelector('.premium-button').getBoundingClientRect();
            const posX = rect.left + rect.width / 2;
            const posY = rect.top + rect.height / 2;
            
            for(let i=0; i<40; i++) {
                particles.push(new Particle(posX, posY, true));
            }
        }
    </script>
</body>
</html>
