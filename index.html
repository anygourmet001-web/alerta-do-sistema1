<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta Urgente do Sistema</title>
    <style>
        body {
            background: linear-gradient(135deg, #fbcfe8, #f472b6, #bae6fd, #7dd3fc); /* Degradê azul e rosa bebê */
            background-size: 400% 400%;
            animation: degradeMovimento 10s ease infinite;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Berçário flutuante no fundo */
        .bercario-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .bebe-elemento {
            position: absolute;
            font-size: 2.5rem;
            bottom: -60px;
            animation: subirBebe 5s linear infinite;
            user-select: none;
        }

        /* Configuração de tempos e posições para a creche flutuante */
        .b1 { left: 10%; animation-duration: 4.5s; animation-delay: 0s; }
        .b2 { left: 28%; animation-duration: 6s; animation-delay: 2s; font-size: 3.5rem; }
        .b3 { left: 48%; animation-duration: 5s; animation-delay: 0.8s; }
        .b4 { left: 70%; animation-duration: 5.5s; animation-delay: 1.5s; font-size: 4rem; }
        .b5 { left: 88%; animation-duration: 4s; animation-delay: 0.3s; }

        /* Conteúdo principal */
        .conteudo {
            position: relative;
            z-index: 2;
            animation: pulsarProposta 0.8s ease-in-out infinite alternate;
        }

        h1 {
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 0 0 15px #db2777, 0 0 30px #0284c7;
            margin: 0;
            line-height: 1.2;
        }

        h2 {
            font-size: 5rem;
            color: #fdf2e9;
            margin: 15px 0 0 0;
            text-shadow: 0 0 20px #ea580c;
        }

        /* Animações */
        @keyframes degradeMovimento {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes subirBebe {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% {
                transform: translateY(-110vh) rotate(20deg);
                opacity: 0;
            }
        }

        @keyframes pulsarProposta {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.04); }
        }
    </style>
</head>
<body>

    <!-- Creche de emojis subindo no fundo -->
    <div class="bercario-bg">
        <div class="bebe-elemento b1">👶</div>
        <div class="bebe-elemento b2">🍼</div>
        <div class="bebe-elemento b3">👶</div>
        <div class="bebe-elemento b4">🍼</div>
        <div class="bebe-elemento b5">👶</div>
    </div>

    <div class="conteudo">
        <h1>Vamos fazer</h1>
        <h2>50 filhos? 👶🍼🛑</h2>
    </div>

</body>
</html>
