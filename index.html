<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Teste da Dorameira</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,100,170,.30),
            transparent 38%
        ),
        radial-gradient(
            circle at 10% 80%,
            rgba(130,70,255,.18),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #110814,
            #2a102b,
            #100710
        );
}


/* =========================================================
   FUNDO
========================================================= */

#background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.float{
    position:absolute;

    top:-60px;

    opacity:.65;

    animation:
        fall linear forwards;
}

@keyframes fall{

    0%{
        transform:
            translateY(-50px)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(110vh)
            rotate(600deg);

        opacity:0;
    }
}


/* =========================================================
   CONTAINER
========================================================= */

.screen{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:16px;

    position:relative;

    z-index:2;
}

.card{

    width:min(440px,100%);

    min-height:600px;

    max-height:calc(100vh - 32px);

    padding:25px 21px;

    border-radius:32px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.12);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    overflow:hidden;
}

.hidden{
    display:none !important;
}


/* =========================================================
   INÍCIO
========================================================= */

.korean{

    font-size:30px;

    margin-bottom:8px;

    opacity:.9;
}

.smallTitle{

    color:#ffb8d5;

    font-size:11px;

    font-weight:800;

    letter-spacing:4px;

    margin-bottom:18px;
}

.mainTitle{

    font-size:40px;

    line-height:1;

    font-weight:900;

    margin-bottom:17px;

    text-shadow:
        0 0 25px
        rgba(255,80,160,.35);
}

.intro{

    color:#ead5e2;

    font-size:15px;

    line-height:1.55;

    max-width:340px;

    margin-bottom:25px;
}

.hero{

    font-size:75px;

    margin-bottom:15px;

    animation:
        heartbeat 1.4s infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.12);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.07);
    }

}


/* =========================================================
   BOTÕES
========================================================= */

button{

    width:100%;

    max-width:350px;

    border:0;

    border-radius:17px;

    padding:16px 15px;

    margin:6px 0;

    color:#fff;

    font-size:15px;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #ff4d91,
            #a82c70
        );

    box-shadow:
        0 9px 25px
        rgba(255,50,140,.22),

        inset 0 1px 0
        rgba(255,255,255,.2);

    cursor:pointer;

    transition:
        transform .15s,
        background .15s;
}

button:active{

    transform:scale(.94);

}

.answer{

    background:
        rgba(255,255,255,.075);

    border:
        1px solid
        rgba(255,255,255,.12);

    text-align:left;

    padding:15px 16px;
}

.answer:hover{

    background:
        rgba(255,255,255,.13);
}


/* =========================================================
   JOGO
========================================================= */

.top{

    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:13px;
}

.episode{

    padding:7px 11px;

    border-radius:20px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.1);

    color:#ffc5da;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;
}

.score{

    font-size:13px;

    color:#ffd1e1;

    font-weight:bold;
}

.progress{

    width:100%;

    height:5px;

    background:
        rgba(255,255,255,.1);

    border-radius:10px;

    overflow:hidden;

    margin-bottom:20px;
}

.progressBar{

    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #ffd0e2
        );

    transition:.4s;
}

.questionEmoji{

    font-size:47px;

    margin-bottom:10px;
}

.question{

    font-size:23px;

    line-height:1.2;

    font-weight:900;

    margin-bottom:20px;

    max-width:390px;
}

.answers{

    width:100%;

    max-width:350px;
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback{

    position:fixed;

    left:50%;
    top:50%;

    width:min(350px,86%);

    padding:25px 20px;

    border-radius:25px;

    transform:
        translate(-50%,-50%)
        scale(.75);

    opacity:0;

    pointer-events:none;

    background:
        rgba(24,6,20,.97);

    border:
        1px solid
        rgba(255,120,180,.35);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);

    z-index:100;

    transition:.25s;

    text-align:center;
}

.feedback.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.feedbackEmoji{

    font-size:55px;

    margin-bottom:10px;
}

.feedbackTitle{

    font-size:22px;

    font-weight:900;

    margin-bottom:9px;
}

.feedbackText{

    font-size:14px;

    line-height:1.5;

    color:#e8d2df;
}


/* =========================================================
   RESULTADO
========================================================= */

.resultEmoji{

    font-size:82px;

    margin-bottom:13px;

    animation:
        resultPop .7s ease;
}

@keyframes resultPop{

    0%{
        transform:
            scale(.1)
            rotate(-30deg);

        opacity:0;
    }

    70%{
        transform:
            scale(1.15)
            rotate(8deg);
    }

    100%{
        transform:
            scale(1)
            rotate(0);

        opacity:1;
    }
}

.resultTitle{

    font-size:31px;

    line-height:1.05;

    font-weight:900;

    margin-bottom:14px;
}

.resultScore{

    display:inline-block;

    padding:8px 16px;

    border-radius:30px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:#ffc5da;

    font-size:13px;

    font-weight:bold;

    margin-bottom:17px;
}

.resultText{

    font-size:15px;

    line-height:1.55;

    color:#ead7e1;

    max-width:350px;

    margin-bottom:20px;
}

.quote{

    padding:15px;

    width:100%;

    max-width:350px;

    border-radius:18px;

    background:
        rgba(255,255,255,.06);

    border-left:
        3px solid
        #ff5b9c;

    color:#ffd9e7;

    font-size:14px;

    line-height:1.45;

    margin-bottom:20px;
}


/* =========================================================
   CONFETES
========================================================= */

.confetti{

    position:fixed;

    left:50%;
    top:50%;

    pointer-events:none;

    z-index:200;

    font-size:20px;
}

</style>
</head>


<body>


<div id="background"></div>


<div class="screen">


<!-- =======================================================
     TELA INICIAL
======================================================= -->

<div class="card" id="start">

    <div class="korean">
        💕 한류 💕
    </div>

    <div class="smallTitle">
        TESTE DEFINITIVO
    </div>

    <div class="hero">
        🎬💗
    </div>

    <div class="mainTitle">
        VOCÊ É MESMO<br>
        UMA DORAMEIRA?
    </div>

    <div class="intro">

        10 perguntas.

        <br>

        Alguns dos doramas mais famosos.

        <br><br>

        E uma avaliação completamente
        <b>científica e confiável</b>
        sobre o nível da sua doença. 😂

    </div>

    <button onclick="startQuiz()">
        🎬 COMEÇAR O TESTE
    </button>

</div>


<!-- =======================================================
     QUIZ
======================================================= -->

<div class="card hidden" id="quiz">

    <div class="top">

        <div class="episode" id="episode">
            EPISÓDIO 1
        </div>

        <div class="score">
            💗 <span id="score">0</span> pts
        </div>

    </div>


    <div class="progress">

        <div
            class="progressBar"
            id="progressBar">
        </div>

    </div>


    <div
        class="questionEmoji"
        id="questionEmoji">
        🎬
    </div>


    <div
        class="question"
        id="question">
    </div>


    <div
        class="answers"
        id="answers">
    </div>

</div>


<!-- =======================================================
     RESULTADO
======================================================= -->

<div class="card hidden" id="result">

    <div
        class="resultEmoji"
        id="resultEmoji">
        👑
    </div>

    <div
        class="resultTitle"
        id="resultTitle">
    </div>

    <div
        class="resultScore"
        id="resultScore">
    </div>

    <div
        class="resultText"
        id="resultText">
    </div>

    <div
        class="quote"
        id="quote">
    </div>

    <button onclick="restart()">
        🔄 FAZER O TESTE NOVAMENTE
    </button>

</div>


</div>


<!-- =======================================================
     FEEDBACK
======================================================= -->

<div
    class="feedback"
    id="feedback">

    <div
        class="feedbackEmoji"
        id="feedbackEmoji">
        😂
    </div>

    <div
        class="feedbackTitle"
        id="feedbackTitle">
    </div>

    <div
        class="feedbackText"
        id="feedbackText">
    </div>

</div>


<script>


/* =========================================================
   FUNDO ANIMADO
========================================================= */

const background =
    document.getElementById("background");

const backgroundItems = [
    "🌸",
    "💕",
    "✨",
    "💗",
    "🎬",
    "☂️",
    "🌙",
    "💮"
];

function createFloat(){

    const el =
        document.createElement("div");

    el.className="float";

    el.textContent =
        backgroundItems[
            Math.floor(
                Math.random() *
                backgroundItems.length
            )
        ];

    el.style.left =
        Math.random()*100+"vw";

    el.style.fontSize =
        (13+Math.random()*18)+"px";

    el.style.animationDuration =
        (5+Math.random()*8)+"s";

    background.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        14000
    );
}

setInterval(
    createFloat,
    420
);

for(let i=0;i<15;i++){

    setTimeout(
        createFloat,
        i*180
    );

}


/* =========================================================
   PERGUNTAS
========================================================= */

const questions = [

{
    emoji:"🔴",

    question:
    "Em Round 6, qual número identifica o protagonista Seong Gi-hun?",

    options:[
        ["456",true,"Essa é a identificação do jogador Seong Gi-hun. 🎯"],
        ["001",false,"Esse número pertence ao personagem conhecido como Jogador 001."],
        ["218",false,"Esse é o número associado a Cho Sang-woo."],
        ["067",false,"Esse número pertence a Kang Sae-byeok."]
    ]
},


{
    emoji:"💍",

    question:
    "Em Rainha das Lágrimas, qual é a relação entre Hong Hae-in e Baek Hyun-woo no início da história?",

    options:[
        ["Eles são casados",true,"Exatamente: Hae-in e Hyun-woo começam a história como marido e mulher."],
        ["Eles são irmãos",false,"Eles não são irmãos; a relação central entre os dois é conjugal."],
        ["Eles são colegas de faculdade",false,"A relação deles não é apresentada dessa forma."],
        ["Eles são rivais políticos",false,"O conflito entre eles é pessoal e familiar, não uma disputa política."]
    ]
},


{
    emoji:"✈️",

    question:
    "Em Pousando no Amor, onde Yoon Se-ri acaba depois de um acidente de parapente?",

    options:[
        ["Coreia do Norte",true,"Sim. O acidente leva Se-ri para território norte-coreano."],
        ["Japão",false,"O acidente não leva Se-ri para o Japão."],
        ["China",false,"A história principal do acidente não se passa na China."],
        ["Tailândia",false,"A localização central dessa situação é outra."]
    ]
},


{
    emoji:"💄",

    question:
    "Em Beleza Verdadeira, qual habilidade Lim Ju-kyung usa para transformar sua aparência?",

    options:[
        ["Maquiagem",true,"A maquiagem é justamente um elemento central da transformação de Ju-kyung."],
        ["Feitiçaria",false,"Apesar de alguns doramas terem fantasia, essa não é a explicação para a transformação dela."],
        ["Cirurgia plástica",false,"A transformação apresentada na história está ligada à maquiagem."],
        ["Um aplicativo de edição",false,"A mudança de aparência não acontece por meio de um aplicativo."]
    ]
},


{
    emoji:"📱",

    question:
    "Em Pretendente Surpresa, qual é a situação que coloca Shin Ha-ri em um encontro que não era originalmente dela?",

    options:[
        ["Ela vai no lugar da amiga",true,"Ha-ri aceita substituir a amiga em um encontro às cegas."],
        ["Ela perde uma aposta",false,"A situação nasce de uma substituição, não de uma aposta."],
        ["Ela é contratada pela empresa",false,"A situação não começa como uma contratação profissional."],
        ["Ela troca de identidade com a irmã",false,"Não é uma troca de identidade com uma irmã."]
    ]
},


{
    emoji:"⚔️",

    question:
    "Em Alquimia das Almas, o que torna a história tão literalmente complicada para os personagens?",

    options:[
        ["Troca de almas entre corpos",true,"A magia da história permite que almas mudem de corpo, criando boa parte da confusão."],
        ["Viagem para outro planeta",false,"A fantasia é ambientada em um mundo próprio, mas não envolve viagem para outro planeta."],
        ["Viagem no tempo para o futuro",false,"O elemento central não é uma viagem temporal ao futuro."],
        ["Clonagem dos personagens",false,"Clonagem não é o mecanismo fantástico central da história."]
    ]
},


{
    emoji:"⚖️",

    question:
    "Em Uma Advogada Extraordinária, qual é a profissão de Woo Young-woo?",

    options:[
        ["Advogada",true,"Sim. Woo Young-woo trabalha como advogada e atua em casos jurídicos."],
        ["Médica",false,"Ela não é médica; sua profissão é ligada ao Direito."],
        ["Promotora",false,"Ela atua como advogada, não como promotora."],
        ["Professora",false,"Ela não exerce a profissão de professora na história."]
    ]
},


{
    emoji:"🧟",

    question:
    "Em All of Us Are Dead, onde os estudantes ficam presos durante o início do surto?",

    options:[
        ["Na escola",true,"O grupo de estudantes fica preso na escola durante o apocalipse zumbi."],
        ["Em um aeroporto",false,"O local central inicial é a escola."],
        ["Em um shopping",false,"O shopping não é o cenário principal dessa situação."],
        ["Em um hospital",false,"O grupo não começa preso em um hospital."]
    ]
},


{
    emoji:"👠",

    question:
    "Em Rainha das Lágrimas, Hong Hae-in pertence a uma poderosa família empresarial conhecida como qual grupo?",

    options:[
        ["Queens Group",true,"Hae-in é herdeira do Queens Group."],
        ["Hyundai Group",false,"Hyundai é um conglomerado real, mas não é o grupo fictício da personagem."],
        ["Samsung Group",false,"Samsung é uma empresa real e não o grupo familiar fictício da trama."],
        ["Mirae Group",false,"Mirae não é o nome do grupo empresarial da família de Hae-in."]
    ]
},


{
    emoji:"💘",

    question:
    "Qual destas situações é praticamente uma regra não escrita dos doramas românticos?",

    options:[
        ["Dois personagens se apaixonarem depois de uma sequência absurda de coincidências",true,"Esse recurso é extremamente comum nas comédias e romances de K-dramas."],
        ["O casal resolver tudo no primeiro episódio",false,"Isso acabaria com boa parte do drama antes de começar."],
        ["Ninguém esconder sentimentos durante a história",false,"Mal-entendidos e sentimentos não ditos são justamente recursos frequentes do gênero."],
        ["Todos os personagens tomarem decisões sensatas",false,"Se todos fossem sensatos, metade dos episódios simplesmente não existiria. 😂"]
    ]
}

];


/* =========================================================
   ESTADO
========================================================= */

let currentQuestion=0;

let score=0;

let locked=false;


/* =========================================================
   ELEMENTOS
========================================================= */

const start =
    document.getElementById("start");

const quiz =
    document.getElementById("quiz");

const result =
    document.getElementById("result");

const question =
    document.getElementById("question");

const questionEmoji =
    document.getElementById("questionEmoji");

const answers =
    document.getElementById("answers");

const scoreElement =
    document.getElementById("score");

const episode =
    document.getElementById("episode");

const progressBar =
    document.getElementById("progressBar");


/* =========================================================
   INICIAR
========================================================= */

function startQuiz(){

    start.classList.add("hidden");

    result.classList.add("hidden");

    quiz.classList.remove("hidden");

    currentQuestion=0;

    score=0;

    locked=false;

    scoreElement.textContent="0";

    showQuestion();

}


/* =========================================================
   MOSTRAR PERGUNTA
========================================================= */

function showQuestion(){

    locked=false;

    const q =
        questions[currentQuestion];

    questionEmoji.textContent =
        q.emoji;

    question.textContent =
        q.question;

    episode.textContent =
        "EPISÓDIO "+
        (currentQuestion+1)+
        " / "+
        questions.length;

    progressBar.style.width =
        (
            currentQuestion /
            questions.length *
            100
        )+"%";

    answers.innerHTML="";


    q.options.forEach(
        (option,index)=>{

            const btn =
                document.createElement("button");

            btn.className="answer";

            btn.textContent =
                option[0];

            btn.addEventListener(
                "pointerdown",
                function(e){

                    e.preventDefault();

                    chooseAnswer(
                        index,
                        option
                    );

                },
                {passive:false}
            );

            answers.appendChild(btn);

        }
    );

}


/* =========================================================
   RESPONDER
========================================================= */

function chooseAnswer(
    index,
    option
){

    if(locked)
        return;

    locked=true;

    const correct =
        option[1];

    if(correct){

        score++;

        scoreElement.textContent =
            score;

        showFeedback(
            "💗",
            "ACERTOU!",
            option[2]
        );

    }else{

        showFeedback(
            "😂",
            "A DORAMEIRA VACILOU!",
            option[3]
        );

    }

    if(navigator.vibrate){

        navigator.vibrate(
            correct
            ? [40]
            : [30,40,30]
        );

    }


    setTimeout(()=>{

        currentQuestion++;

        if(
            currentQuestion >=
            questions.length
        ){

            finishQuiz();

        }else{

            showQuestion();

        }

    },1250);

}


/* =========================================================
   FEEDBACK
========================================================= */

let feedbackTimer;

function showFeedback(
    emoji,
    title,
    text
){

    const box =
        document.getElementById("feedback");

    document.getElementById(
        "feedbackEmoji"
    ).textContent=emoji;

    document.getElementById(
        "feedbackTitle"
    ).textContent=title;

    document.getElementById(
        "feedbackText"
    ).textContent=text;

    box.classList.add("show");

    clearTimeout(feedbackTimer);

    feedbackTimer =
        setTimeout(()=>{

            box.classList.remove("show");

        },1050);

}


/* =========================================================
   RESULTADO
========================================================= */

function finishQuiz(){

    quiz.classList.add("hidden");

    result.classList.remove("hidden");

    progressBar.style.width="100%";


    let data;


    if(score>=9){

        data={

            emoji:"👑🔥",

            title:
            "VOCÊ NÃO ASSISTE DORAMA...",

            score:
            score+" / "+questions.length+
            " — NÍVEL: LENDÁRIA",

            text:
            "Você não é uma simples dorameira. Você já está em um nível em que provavelmente reconhece o protagonista pelo olhar, sabe quando vai acontecer o beijo antes da trilha sonora e já desconfia do personagem bonzinho desde o episódio 2. 😂",

            quote:
            "⚠️ DIAGNÓSTICO: caso avançado.<br><br>Recomendação médica: mais um episódio.<br><br>Possíveis efeitos colaterais: madrugada, olheiras e gritos para a televisão."
        };

    }

    else if(score>=7){

        data={

            emoji:"💗🎬",

            title:
            "DORAMEIRA PROFISSIONAL",

            score:
            score+" / "+questions.length+
            " — RESPEITÁVEL",

            text:
            "Você sabe das coisas! Talvez ainda não consiga prever todos os plot twists, mas já sabe que quando o protagonista fala 'precisamos conversar'... alguma desgraça vem aí. 😂",

            quote:
            "Seu nível atual permite recomendar doramas para outras pessoas sem responsabilidade alguma sobre as noites de sono delas."
        };

    }

    else if(score>=5){

        data={

            emoji:"😂🍿",

            title:
            "DORAMEIRA EM TREINAMENTO",

            score:
            score+" / "+questions.length+
            " — TEM POTENCIAL",

            text:
            "Você conhece alguns clássicos, mas ainda precisa cumprir algumas horas de estágio na Netflix. Relaxa: ninguém nasce sabendo diferenciar o segundo protagonista do verdadeiro amor da protagonista. 😂",

            quote:
            "Missão recomendada: escolher um dorama famoso, começar 'só o primeiro episódio' e aparecer 6 horas depois perguntando por que está amanhecendo."
        };

    }

    else{

        data={

            emoji:"😭📺",

            title:
            "VOCÊ PRECISA DE AJUDA!",

            score:
            score+" / "+questions.length+
            " — SITUAÇÃO DELICADA",

            text:
            "Tem alguém aí que claramente precisa passar mais tempo vendo dorama. 😂 Mas não se preocupe: o tratamento é simples e completamente indolor.",

            quote:
            "💊 PRESCRIÇÃO:<br><br>1 episódio por noite.<br>Se houver recaída, assistir mais 3.<br>Se terminar a temporada de madrugada... não nos responsabilizamos."
        };

    }


    document.getElementById(
        "resultEmoji"
    ).textContent =
        data.emoji;

    document.getElementById(
        "resultTitle"
    ).textContent =
        data.title;

    document.getElementById(
        "resultScore"
    ).textContent =
        data.score;

    document.getElementById(
        "resultText"
    ).textContent =
        data.text;

    document.getElementById(
        "quote"
    ).innerHTML =
        data.quote;


    createConfetti();


    if(navigator.vibrate){

        navigator.vibrate([
            70,
            50,
            100,
            50,
            150
        ]);

    }

}


/* =========================================================
   CONFETES
========================================================= */

function createConfetti(){

    const symbols=[
        "💗",
        "🌸",
        "✨",
        "😂",
        "🎬",
        "💕",
        "🍿",
        "🇰🇷"
    ];

    for(
        let i=0;
        i<40;
        i++
    ){

        const c =
            document.createElement("div");

        c.className="confetti";

        c.textContent =
            symbols[
                Math.floor(
                    Math.random()*
                    symbols.length
                )
            ];

        const x =
            Math.random()*700-350;

        const y =
            Math.random()*900-450;

        document.body.appendChild(c);

        c.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(.2)",
                    opacity:0
                },

                {
                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        )
                        scale(1)
                        rotate(360deg)`,

                    opacity:1
                },

                {
                    transform:
                        `translate(
                            calc(-50% + ${x*1.2}px),
                            calc(-50% + ${y*1.3}px)
                        )
                        scale(.5)
                        rotate(720deg)`,

                    opacity:0
                }

            ],

            {

                duration:
                    1300+
                    Math.random()*900,

                easing:
                    "cubic-bezier(.2,.7,.2,1)"

            }

        );

        setTimeout(
            ()=>c.remove(),
            2400
        );

    }

}


/* =========================================================
   RECOMEÇAR
========================================================= */

function restart(){

    result.classList.add("hidden");

    start.classList.remove("hidden");

    currentQuestion=0;

    score=0;

    scoreElement.textContent="0";

    progressBar.style.width="0%";

}


/* =========================================================
   BLOQUEIO DE SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            !quiz.classList.contains("hidden")
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);

</script>
