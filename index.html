<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Doce</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffe4e6, #fbcfe8, #f472b6);
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Elementos flutuantes no fundo */
        .doces-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .doce-elemento {
            position: absolute;
            font-size: 2.5rem;
            bottom: -70px;
            animation: subirDoce 4.5s linear infinite;
            user-select: none;
        }

        .d1 { left: 12%; animation-duration: 4s; }
        .d2 { left: 35%; animation-duration: 5.5s; font-size: 3.2rem; }
        .d3 { left: 58%; animation-duration: 4.8s; }
        .d4 { left: 78%; animation-duration: 5.2s; font-size: 3.5rem; }
        .d5 { left: 91%; animation-duration: 3.8s; }

        .conteudo {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            max-width: 90%;
        }

        /* ILUSTRAÇÃO DO BOLO EM CSS */
        .bolo-container {
            width: 200px;
            height: 160px;
            position: relative;
            margin-bottom: 30px;
            animation: flutuar 2s ease-in-out infinite alternate;
        }

        .cobertura {
            width: 160px;
            height: 40px;
            background: #f43f5e;
            border-radius: 20px 20px 0 0;
            position: absolute;
            bottom: 60px;
            left: 20px;
            z-index: 4;
            box-shadow: 0 6px 0 #db2777;
        }

        .recheio {
            width: 160px;
            height: 20px;
            background: #fdf2e9;
            position: absolute;
            bottom: 40px;
            left: 20px;
            z-index: 3;
        }

        .massa {
            width: 160px;
            height: 40px;
            background: #b45309;
            border-radius: 0 0 10px 10px;
            position: absolute;
            bottom: 0;
            left: 20px;
            z-index: 2;
        }

        .morango-topo {
            width: 34px;
            height: 34px;
            background: #dc2626;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: absolute;
            bottom: 100px;
            left: 83px;
            z-index: 5;
            transform: rotate(-45deg);
            animation: pulsarMorango 0.6s infinite alternate;
        }

        .morango-topo::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #16a34a;
            border-radius: 50%;
            top: -2px;
            left: -2px;
        }

        /* Textos */
        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 0 4px 10px #db2777, 0 0 20px #db2777;
            margin: 5px 0;
        }

        h2 {
            font-size: 2rem;
            color: #fdf2e9;
            text-shadow: 0 3px 8px #be185d;
            margin: 10px 0;
        }

        /* Animações */
        @keyframes subirDoce {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        @keyframes flutuar {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        @keyframes pulsarMorango {
            0% { transform: scale(1) rotate(-45deg); }
            100% { transform: scale(1.1) rotate(-45deg); }
        }
    </style>
</head>
<body>

    <div class="doces-bg">
        <div class="doce-elemento d1">🍓</div>
        <div class="doce-elemento d2">🍰</div>
        <div class="doce-elemento d3">🍓</div>
        <div class="doce-elemento d4">🍰</div>
        <div class="doce-elemento d5">🍓</div>
    </div>

    <div class="conteudo">
        <!-- Ilustração em código pura e estável -->
        <div class="bolo-container">
            <div class="morango-topo"></div>
            <div class="cobertura"></div>
            <div class="recheio"></div>
            <div class="massa"></div>
        </div>
        
        <h1>Hummmm... 🍓</h1>
        <h2>Bolo de muranguu! 🍰✨</h2>
    </div>

</body>
</html>
